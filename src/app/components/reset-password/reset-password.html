<div class="min-h-screen bg-background-light dark:bg-background-dark font-display text-[#101819] dark:text-[#f9fbfb] flex flex-col">
  <nav class="p-4 md:p-5 lg:p-6 flex items-center">
    <a routerLink="/register" class="size-10 md:size-12 lg:size-14 flex items-center justify-center rounded-full hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
      <span class="material-symbols-outlined text-xl md:text-2xl lg:text-3xl">arrow_back_ios_new</span>
    </a>
  </nav>

  <main class="max-w-md md:max-w-lg lg:max-w-xl mx-auto w-full px-4 md:px-6 lg:px-8 flex-grow flex flex-col">
    <div class="mb-6 md:mb-8 lg:mb-10 text-center">
      <div class="mb-4">
        <img src="/logo.png" alt="禾笙教育" class="mx-auto size-14 md:size-16 lg:size-20 object-contain" />
      </div>
      <h1 class="text-2xl md:text-3xl lg:text-4xl font-extrabold tracking-tight">重設密碼</h1>
      <p class="text-gray-500 dark:text-gray-400 mt-2 text-sm md:text-base">請設定您的新密碼</p>
    </div>

    <div class="login-form space-y-4">
      @if (message()) {
        <div class="bg-green-50 dark:bg-green-900/20 border border-green-200 dark:border-green-800 text-green-700 dark:text-green-400 px-4 py-3 rounded-lg text-sm">
          {{ message() }}
        </div>
      }
      @if (error()) {
        <div class="bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-700 dark:text-red-400 px-4 py-3 rounded-lg text-sm">
          {{ error() }}
        </div>
      }
      @if (!success()) {
        <div class="space-y-1">
          <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">新密碼</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
            <input [(ngModel)]="newPassword" name="newPassword" (keydown.enter)="submit()" class="w-full pl-12 pr-12 py-3 md:py-4 bg-white dark:bg-gray-800 border-0 rounded-xl shadow-sm focus:ring-2 focus:ring-primary text-sm md:text-base" placeholder="至少 6 個字元" type="password"/>
            <button (click)="togglePassword()" class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
              <span class="material-symbols-outlined">{{ showPassword() ? 'visibility_off' : 'visibility' }}</span>
            </button>
          </div>
        </div>
        <div class="space-y-1">
          <label class="text-xs font-bold text-gray-500 ml-1 uppercase tracking-wider">確認新密碼</label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">lock</span>
            <input [(ngModel)]="confirmPassword" name="confirmPassword" (keydown.enter)="submit()" class="w-full pl-12 pr-4 py-3 md:py-4 bg-white dark:bg-gray-800 border-0 rounded-xl shadow-sm focus:ring-2 focus:ring-primary text-sm md:text-base" placeholder="再次輸入新密碼" type="password"/>
          </div>
        </div>
        <button (click)="submit()" [disabled]="loading()" class="w-full bg-primary hover:bg-primary/90 disabled:opacity-50 text-white font-extrabold py-3 md:py-4 rounded-xl shadow-lg transition-all mt-2 text-sm md:text-base flex items-center justify-center gap-2">
          @if (loading()) {
            <span class="material-symbols-outlined animate-spin">refresh</span>
          }
          {{ loading() ? '重設中...' : '確認重設密碼' }}
        </button>
      } @else {
        <button (click)="goLogin()" class="w-full bg-primary hover:bg-primary/90 text-white font-extrabold py-3 md:py-4 rounded-xl shadow-lg transition-all mt-2 text-sm md:text-base">
          重新登入
        </button>
      }
    </div>
  </main>

  <footer class="p-4 md:p-6 text-center">
    <p class="text-[10px] md:text-xs text-gray-400 font-medium leading-relaxed">
      禾笙文理補習班 &middot; 啟發潛能，成就卓越未來
    </p>
  </footer>
</div>
